[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "WTForms-Components"
dynamic = ["version"]
description = "Additional fields, validators and widgets for WTForms."
readme = "README.rst"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Konsta Vesterinen", email = "konsta@fastmonkeys.com" }]
requires-python = ">=3.11"
dependencies = [
    "WTForms>=3.1.0",
    "validators>=0.21",
    "intervals>=0.6.0",
    "MarkupSafe>=2.0",
]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
color = ["colour>=0.0.4"]

[project.urls]
Homepage = "https://github.com/kvesteri/wtforms-components"
Documentation = "https://wtforms-components.readthedocs.io/"
Changelog = "https://github.com/kvesteri/wtforms-components/blob/master/CHANGES.rst"
Issues = "https://github.com/kvesteri/wtforms-components/issues"

[dependency-groups]
test = [
    "pytest>=8.0",
    "ruff==0.17.4",
    "WTForms-Test>=0.1.1",
    "colour>=0.0.4",
]

[tool.hatch.version]
path = "wtforms_components/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/wtforms_components", "/tests", "/docs", "/CHANGES.rst", "/tox.ini"]
exclude = ["/docs/_build"]

[tool.ruff]
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "C90", # mccabe
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.pytest.ini_options]
filterwarnings = ["error::DeprecationWarning:wtforms"]
